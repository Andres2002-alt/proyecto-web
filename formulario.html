<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro - PowerFit Gym</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>

<div class="logo">
<h1>PowerFit Gym</h1>
</div>

<nav>
<ul>
<li><a href="index.html">Inicio</a></li>
<li><a href="clases.html">Clases</a></li>

<li><a href="carrito.html">Carrito</a></li>
<li><a href="inscripcion.html">Inscripción</a></li>
</ul>
</nav>

</header>


<main>

<section class="registro">

<h2>Formulario de Registro</h2>

<form>

<h3>Datos Personales</h3>

<label>Nombre</label>
<input type="text" name="nombre" required>

<label>Apellido</label>
<input type="text" name="apellido" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Número de celular</label>
<input type="tel" name="celular" required>

<label>Fecha de nacimiento</label>
<input type="date" name="fecha_nacimiento">

<label>Género</label>

<select name="genero">
<option>Masculino</option>
<option>Femenino</option>
<option>Otro</option>
</select>


<h3>Datos de Pago</h3>

<label>Dirección de cobro</label>
<input type="text" name="direccion">

<label>Forma de pago</label>

<select name="pago">
<option>Tarjeta de crédito</option>
<option>Tarjeta de débito</option>
<option>Transferencia bancaria</option>
</select>

<br><br>

<button type="submit">Confirmar Registro</button>

</form>

</section>

</main>


<footer>

<div class="contacto">
<h3>Contacto</h3>
<p>Email: powerfit@gmail.com</p>
<p>Teléfono: 0999999999</p>
</div>

<div class="redes">
<h3>Redes Sociales</h3>
<p>Facebook</p>
<p>Instagram</p>
<p>TikTok</p>
</div>

</footer>

</body>
</html>
